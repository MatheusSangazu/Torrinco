name: Schema consistency

on:
  pull_request:
    paths:
      - 'server/prisma/**'
      - 'server/src/generated/**'
      - 'server/scripts/schema-smoke.ts'
  push:
    branches: [main]

jobs:
  migrate-and-read:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: torrinco_schema_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/torrinco_schema_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run test:schema
